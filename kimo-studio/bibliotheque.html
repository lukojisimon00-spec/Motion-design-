<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KIMO Bibliothèque</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b0b0b; color: #fff; font: 14px system-ui, sans-serif; padding: 16px; }
    h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: .06em; } h1 a { color: #ff8a00; font-size: 14px; margin-left: 12px; }
    h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #9a9a9a; margin: 20px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    figure { margin: 0; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; border-radius: 12px; padding: 8px; color: #000; text-align: center; }
    figure img { width: 100%; height: 130px; object-fit: contain; } figcaption { font-size: 11px; }
  </style>
</head>
<body>
  <h1>KIMO · BIBLIOTHÈQUE <a href="index.html">← studio</a></h1>
  <div id="out"></div>
  <script type="module">
    const out = document.getElementById("out");
    const res = await fetch("src/kimo.json");
    const k = await res.json();
    const groups = [["Poses", k.poses], ["Expressions B (utilisées par le moteur)", k.expressions.b], ["Expressions A (variante)", k.expressions.a], ["Rotation", k.rotation]];
    for (const [title, items] of groups) {
      const h = document.createElement("h2"); h.textContent = `${title} (${items.length})`;
      const g = document.createElement("div"); g.className = "grid";
      for (const it of items) {
        const f = document.createElement("figure");
        f.innerHTML = `<img src="${it.src}" alt="${it.nom}" loading="lazy"><figcaption>${it.nom}</figcaption>`;
        g.append(f);
      }
      out.append(h, g);
    }
  </script>
</body>
</html>
